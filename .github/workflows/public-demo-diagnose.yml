# One-off: prints the public demo apps' Dokploy settings with secrets masked (see docs/public-demo.md).
name: Public demo diagnose

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    if: vars.PUBLIC_DEMO_HOST != '' && vars.DOKPLOY_PUBLIC_URL != '' && vars.DEPLOY_ENABLED == 'true'
    runs-on: [self-hosted, the-keep]
    timeout-minutes: 5
    env:
      DOKPLOY_URL: ${{ vars.DOKPLOY_PUBLIC_URL }}
      DOKPLOY_PUBLIC_URL: ${{ vars.DOKPLOY_PUBLIC_URL }}
      DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Print the demo apps
        env:
          PUBLIC_DEMO_HOST: ${{ vars.PUBLIC_DEMO_HOST }}
          PUBLIC_DEMO_LIBRARY_HOST: public-demo.${{ vars.PREVIEW_DOMAIN }}
          DEMO_HOST: demo.${{ vars.PREVIEW_DOMAIN }}
        run: node scripts/deploy/dokploy.mjs public-demo-diagnose
      - name: Containers and their last log lines
        continue-on-error: true
        run: |
          mask() { sed -E 's/(t|p|token|password|s)=[^&" ]+/\1=<x>/g'; }
          docker ps --format '{{.Names}}  {{.Image}}  {{.Status}}' | grep -i -E 'lodesong' | mask || echo "no lodesong containers visible"
          for name in $(docker ps --format '{{.Names}}' | grep -i -E 'lodesong-(public-demo|demo)'); do
            echo "=== $name"
            docker logs --tail 40 "$name" 2>&1 | mask
          done
          echo "=== services"
          docker service ls --format '{{.Name}}  {{.Image}}  {{.Replicas}}' 2>&1 | grep -i lodesong | mask || true
