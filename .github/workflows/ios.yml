# Compiles the iPhone app on a macOS runner and builds an unsigned IPA: the file you sideload with a free Apple ID
# (docs/ios.md). On a published release the IPA and the AltStore source (altstore.json) are attached to it. On main they go to
# the ios-beta branch instead (apps/ios/altstore/beta.sh). Runs only when the app or its workflow changes.
name: iOS

on:
  pull_request:
    paths: [apps/ios/**, .github/workflows/ios.yml]
  push:
    branches: [main]
    paths: [apps/ios/**, .github/workflows/ios.yml]
  release:
    types: [published]
  workflow_dispatch:
  # ci.yml calls this after it creates a release (a release made with the default token starts no workflow of its own).
  workflow_call:
    inputs:
      tag:
        type: string
        default: ""

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    outputs:
      beta: ${{ steps.version.outputs.beta }}
      version: ${{ steps.version.outputs.version }}
      build: ${{ steps.version.outputs.build }}
    steps:
      - uses: actions/checkout@v7
      # A main build is the next patch as a prerelease: above the last release, below the next one.
      - name: Version
        id: version
        env:
          BETA: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && !inputs.tag }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          BUILD=1
          if [ "$BETA" = true ]; then
            BUILD=$GITHUB_RUN_NUMBER
            VERSION="${VERSION%.*}.$((${VERSION##*.} + 1))-beta.$BUILD"
          fi
          { echo "beta=$BETA"; echo "version=$VERSION"; echo "build=$BUILD"; } >> "$GITHUB_OUTPUT"
      - name: Core tests
        run: swift test --package-path apps/ios
      - name: Project from project.yml
        run: |
          brew install xcodegen
          cd apps/ios && xcodegen generate
      - name: Compile for the simulator
        run: |
          xcodebuild -project apps/ios/Lodesong.xcodeproj -scheme Lodesong -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build
      - name: Unsigned IPA for a device
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BUILD: ${{ steps.version.outputs.build }}
        run: |
          xcodebuild -project apps/ios/Lodesong.xcodeproj -scheme Lodesong -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath apps/ios/build \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$BUILD" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
          cd apps/ios/build/Build/Products/Release-iphoneos
          mkdir Payload && cp -R lodesong.app Payload/
          zip -qr "$GITHUB_WORKSPACE/lodesong-ios.ipa" Payload
      - name: Check the AltStore source
        run: apps/ios/altstore/source.sh lodesong-ios.ipa "v$(node -p "require('./package.json').version")" | jq -e '.apps[0].versions[0].size > 0'
      - uses: actions/upload-artifact@v7
        with:
          name: lodesong-ios
          path: lodesong-ios.ipa

  # Only these two jobs can write, and neither runs for a pull request.
  attach:
    needs: build
    if: github.event_name == 'release' || inputs.tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: lodesong-ios
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          gh release view "$TAG" --json body -q .body > notes.md
          apps/ios/altstore/source.sh lodesong-ios.ipa "$TAG" notes.md > altstore.json
          gh release upload "$TAG" lodesong-ios.ipa altstore.json --clobber

  beta:
    needs: build
    if: needs.build.outputs.beta == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: ios-beta
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: lodesong-ios
      - name: Publish to the ios-beta branch
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          APP_VERSION: ${{ needs.build.outputs.version }}
          APP_BUILD: ${{ needs.build.outputs.build }}
        run: apps/ios/altstore/beta.sh lodesong-ios.ipa
