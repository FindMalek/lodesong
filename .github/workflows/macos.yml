# Builds the macOS app (ad-hoc signed, not notarized) and its Fleet pkg on a macOS runner. On a release the zip (the
# in-app updater reads it) and the pkg (docs/macos/fleet.md) are attached to it. Runs only when the app changes.
name: macOS

on:
  pull_request:
    paths: [apps/macos/**, .github/workflows/macos.yml]
  push:
    branches: [main]
    paths: [apps/macos/**, .github/workflows/macos.yml]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to attach the zip and pkg to, empty to only build
        type: string
        default: ""
  # ci.yml calls this after it creates a release (a release made with the default token starts no workflow of its own).
  workflow_call:
    inputs:
      tag:
        type: string
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the app and the pkg
        run: |
          apps/macos/build.sh
          apps/macos/pkg.sh
          ditto -c -k --keepParent apps/macos/dist/lodesong.app lodesong-macos.zip
          cp apps/macos/dist/lodesong-macos.pkg .
      - uses: actions/upload-artifact@v4
        with:
          name: lodesong-macos
          path: |
            lodesong-macos.zip
            lodesong-macos.pkg
      - name: Attach to the release
        if: inputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: gh release upload "$TAG" lodesong-macos.zip lodesong-macos.pkg --clobber
