# Builds the Linux and Windows desktop app (apps/desktop, Tauri) into installers. On a release they are attached to it.
# Unsigned: Windows SmartScreen warns on first run (docs/desktop.md). Runs only when the app or its workflow changes.
name: Desktop

on:
  pull_request:
    paths: [apps/desktop/**, .github/workflows/desktop.yml]
  push:
    branches: [main]
    paths: [apps/desktop/**, .github/workflows/desktop.yml]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to attach the installers to, empty to only build
        type: string
        default: ""
  # ci.yml calls this after it creates a release (a release made with the default token starts no workflow of its own).
  workflow_call:
    inputs:
      tag:
        type: string
        default: ""

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            bundles: deb,appimage
          - os: windows-latest
            bundles: msi,nsis
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    env:
      APPIMAGE_EXTRACT_AND_RUN: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - name: System libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Build the installers
        working-directory: apps/desktop
        run: |
          VERSION=$(node -p "require('../../package.json').version")
          npx --yes @tauri-apps/cli@2 build --bundles ${{ matrix.bundles }} --config "{\"version\":\"$VERSION\"}"
      - name: Collect
        run: |
          mkdir out
          cd apps/desktop/src-tauri/target/release/bundle
          for file in deb/*.deb appimage/*.AppImage msi/*.msi nsis/*.exe; do
            [ -f "$file" ] || continue
            ext="${file##*.}"
            [ "$ext" = exe ] && suffix="-setup" || suffix=""
            cp "$file" "$GITHUB_WORKSPACE/out/lodesong-${{ runner.os == 'Linux' && 'linux' || 'windows' }}$suffix.$ext"
          done
          ls -l "$GITHUB_WORKSPACE/out"
      - uses: actions/upload-artifact@v7
        with:
          name: lodesong-desktop-${{ runner.os }}
          path: out/*
      - name: Attach to the release
        if: inputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: gh release upload "$TAG" out/* --clobber
