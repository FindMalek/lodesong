<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>lodesong</title>
    <style>
      :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: Canvas; color: CanvasText; }
      main { width: min(420px, 100% - 48px); }
      h1 { font-size: 1.8rem; font-weight: 500; margin: 1rem 0 .5rem; }
      p { opacity: .65; line-height: 1.4; }
      .mark { display: flex; align-items: center; gap: .6rem; font-family: ui-monospace, monospace; }
      .mark i { width: 12px; height: 12px; background: currentColor; }
      input, button { width: 100%; box-sizing: border-box; padding: .7rem; font: inherit; border: 1px solid #8888; background: transparent; color: inherit; }
      button { margin-top: .8rem; background: CanvasText; color: Canvas; cursor: pointer; }
      #error { color: #d33; font-size: .85rem; min-height: 1.2em; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark"><i></i>lodesong</div>
      <h1>where is your lodesong?</h1>
      <p>The address you open it at in a browser, like https://music.example.com. On your home network it can be an IP and port.</p>
      <form id="form">
        <input id="address" placeholder="https://music.example.com" autocomplete="url" autofocus spellcheck="false" />
        <div id="error"></div>
        <button type="submit">connect</button>
      </form>
    </main>
    <script>
      function normalize(raw) {
        let text = raw.trim();
        if (!text) return null;
        if (!text.includes("://")) {
          const local = text.endsWith(".local") || text.includes(":") || /^\d{1,3}(\.\d{1,3}){3}/.test(text);
          text = (local ? "http://" : "https://") + text;
        }
        text = text.replace(/\/+$/, "");
        try {
          const url = new URL(text);
          return url.hostname && /^https?:$/.test(url.protocol) ? text : null;
        } catch {
          return null;
        }
      }
      document.getElementById("form").addEventListener("submit", async (event) => {
        event.preventDefault();
        const error = document.getElementById("error");
        const address = normalize(document.getElementById("address").value);
        if (!address) {
          error.textContent = "That doesn't look like an address.";
          return;
        }
        error.textContent = "";
        try {
          await window.__TAURI__.core.invoke("set_server", { address });
        } catch (failure) {
          error.textContent = String(failure);
        }
      });
    </script>
  </body>
</html>
